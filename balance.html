<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KotakEngine Balance</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090d16;
            color: #f1f5f9;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HLAVNÍ ČÁSTKA A GRAF --- */
        .balance-display {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 10px 20px;
            flex-shrink: 0;
        }

        .balance-value {
            font-size: 58px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            text-align: center;
            transform-origin: center;
        }

        /* Barvy zůstatku */
        .balance-value.color-green {
            color: #22c55e;
            text-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
        }
        .balance-value.color-yellow {
            color: #eab308;
            text-shadow: 0 4px 20px rgba(234, 179, 8, 0.3);
        }
        .balance-value.color-red {
            color: #ef4444;
            text-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
        }

        /* Výrazné pulzování */
        .balance-value.pulsing {
            animation: pulse-heavy 0.8s infinite alternate ease-in-out;
        }
        @keyframes pulse-heavy {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.18); opacity: 0.6; }
        }

        /* SVG Lomený graf pod částkou (posledních 10 zápisů) */
        .trend-chart-container {
            width: 180px;
            height: 35px;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .trend-chart-container svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* --- EDIT MODE TLAČÍTKA (Vedle sebe v jedné řadě) --- */
        .edit-panel {
            display: none;
            width: 100%;
            max-width: 380px;
            margin-top: 12px;
            gap: 6px;
            justify-content: center;
            flex-wrap: nowrap;
            flex-shrink: 0;
            padding: 0 10px;
        }
        .edit-panel.visible { display: flex; }
        
        .edit-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: #1e293b;
            color: #f1f5f9;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .edit-btn:active { background: #334155; }
        .edit-btn.active-pulse { background: #eab308; color: #090d16; border-color: #eab308; }

        /* --- FORMULÁŘE A MODALY --- */
        .balance-form-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 90;
        }
        .balance-form-overlay.active { display: block; }

        .balance-form {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 360px;
            background: #0f172a;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 24px;
            z-index: 91;
        }
        .balance-form.active { display: block; }
        .balance-form h2 { margin-bottom: 16px; font-size: 18px; color: #fff; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
        .form-group input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }

        .modal-btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; font-weight: bold; background: #334155; color: #fff; cursor: pointer; }
        .modal-btn.primary { background: #38bdf8; color: #090d16; }
        .modal-close { background: transparent; color: #94a3b8; margin-top: 5px; }

        /* --- HISTORIE PLATEB --- */
        .history-list {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px 20px 20px 20px;
            overflow-y: auto;
        }
        .history-list::-webkit-scrollbar { display: none; }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 14px;
            padding: 12px 16px;
            flex-shrink: 0;
        }
        .history-item .history-info { font-size: 14px; color: #cbd5e1; }
        .history-item .history-amount { font-size: 16px; font-weight: bold; }
        .history-item .history-amount.negative { color: #ef4444; }
        .history-item .history-amount.positive { color: #33b322; }
    </style>
</head>
<body>

    <!-- ZŮSTATEK -->
    <div class="balance-display" id="balanceDisplay">
        <div class="balance-value color-green" id="balanceValue" onclick="handleBalanceTap()">0 Kč</div>
        
        <!-- Lomený graf pro posledních 10 zápisů -->
        <div class="trend-chart-container">
            <svg id="trendSvg" viewBox="0 0 180 35"></svg>
        </div>

        <!-- EDIT MODE TLAČÍTKA V JEDNÉ ŘADĚ -->
        <div class="edit-panel" id="editPanel">
            <button class="edit-btn" id="btnPulseToggle" onclick="togglePulseNotification()">Upozornit</button>
            <button class="edit-btn" onclick="openBalanceForm(true)">Odebrat</button>
            <button class="edit-btn" onclick="openBalanceForm(false)">Přidat</button>
            <button class="edit-btn" onclick="triggerNotificationAction()">Oznámení</button>
        </div>
    </div>

    <!-- FORMULÁŘ PŘIDAT / ODEBRAT -->
    <div class="balance-form-overlay" id="balanceFormOverlay" onclick="closeBalanceForm()"></div>
    <div class="balance-form" id="balanceForm">
        <h2 id="balanceFormTitle">Přidat částku</h2>
        <div class="form-group">
            <label>Částka (Kč)</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="inpBalanceAmount" placeholder="např. 250">
        </div>
        <div class="form-group">
            <label>Důvod</label>
            <input type="text" id="inpBalanceInfo" placeholder="např. výplata, předplatné...">
        </div>
        <button class="modal-btn primary" style="margin-top: 15px;" onclick="submitBalanceEntry()">Uložit</button>
        <button class="modal-btn modal-close" onclick="closeBalanceForm()">Zrušit</button>
    </div>

    <!-- AKCE NAD HISTORIÍ (UPRAVIT / SMAZAT) -->
    <div class="balance-form-overlay" id="historyActionOverlay" onclick="closeHistoryActionSheet()"></div>
    <div class="balance-form" id="historyActionSheet">
        <h2>Platba</h2>
        <button class="modal-btn primary" style="margin-top: 5px;" onclick="editHistoryEntryFromSheet()">Upravit</button>
        <button class="modal-btn" style="margin-top: 12px; background: #ef4444; color: #fff;" onclick="deleteHistoryEntryFromSheet()">Smazat</button>
        <button class="modal-btn modal-close" style="margin-top: 12px;" onclick="closeHistoryActionSheet()">Zrušit</button>
    </div>

    <!-- HISTORIE -->
    <div class="history-list" id="historyList"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6eh8N7PAe3nE7jCaJyO_g6JgihBLA-sw",
            authDomain: "kotakengine-apk-gui.firebaseapp.com",
            databaseURL: "https://kotakengine-apk-gui-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotakengine-apk-gui",
            storageBucket: "kotakengine-apk-gui.firebasestorage.app",
            messagingSenderId: "1022545988426",
            appId: "1:1022545988426:web:bc2f53f04066f306564fb3",
            measurementId: "G-KV7D40WL5J"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function formatBalance(num) {
            return Number(num).toLocaleString('cs-CZ');
        }

        // --- 10x KLIKNUTÍ PRO OTEVŘENÍ EDIT MODE PANELU ---
        let balanceTapCount = 0;
        let balanceTapTimer = null;
        let pendingNegative = false;

        function setEditPanelVisible(visible) {
            const panel = document.getElementById('editPanel');
            if (visible) {
                panel.classList.add('visible');
            } else {
                panel.classList.remove('visible');
            }
            localStorage.setItem('kotak_edit_panel_visible', visible ? '1' : '0');
        }

        function handleBalanceTap() {
            balanceTapCount++;
            clearTimeout(balanceTapTimer);
            balanceTapTimer = setTimeout(() => { balanceTapCount = 0; }, 1500);

            if (balanceTapCount >= 10) {
                balanceTapCount = 0;
                const panel = document.getElementById('editPanel');
                setEditPanelVisible(!panel.classList.contains('visible'));
            }
        }

        if (localStorage.getItem('kotak_edit_panel_visible') === '1') {
            document.getElementById('editPanel').classList.add('visible');
        }

        // --- TLAČÍTKO UPOZORNIT (VÝRAZNÉ PULZOVÁNÍ) ---
        let isPulsingActive = localStorage.getItem('kotak_pulse_active') === '1';
        if (isPulsingActive) {
            document.getElementById('balanceValue').classList.add('pulsing');
            document.getElementById('btnPulseToggle').classList.add('active-pulse');
        }

        function togglePulseNotification() {
            isPulsingActive = !isPulsingActive;
            const valEl = document.getElementById('balanceValue');
            const btnEl = document.getElementById('btnPulseToggle');

            if (isPulsingActive) {
                valEl.classList.add('pulsing');
                btnEl.classList.add('active-pulse');
                localStorage.setItem('kotak_pulse_active', '1');
            } else {
                valEl.classList.remove('pulsing');
                btnEl.classList.remove('active-pulse');
                localStorage.setItem('kotak_pulse_active', '0');
            }
        }

        function triggerNotificationAction() {
            alert('Tlačítko Oznámení – připraveno k nastavení!');
        }

        // --- FORMULÁŘ ---
        function openBalanceForm(negative) {
            pendingNegative = negative;
            editingHistoryKey = null;
            document.getElementById('balanceFormTitle').textContent = negative ? 'Odebrat částku' : 'Přidat částku';
            document.getElementById('inpBalanceAmount').value = '';
            document.getElementById('inpBalanceInfo').value = '';
            document.getElementById('balanceFormOverlay').classList.add('active');
            document.getElementById('balanceForm').classList.add('active');
        }

        function closeBalanceForm() {
            document.getElementById('balanceFormOverlay').classList.remove('active');
            document.getElementById('balanceForm').classList.remove('active');
        }

        function submitBalanceEntry() {
            const amount = parseFloat(document.getElementById('inpBalanceAmount').value);
            const info = document.getElementById('inpBalanceInfo').value.trim();

            if (!amount || amount <= 0) {
                alert('Zadej platnou částku');
                return;
            }

            if (editingHistoryKey) {
                db.ref('money/history/' + editingHistoryKey).set({
                    number: amount,
                    negative: pendingNegative,
                    info: info
                });
                editingHistoryKey = null;
            } else {
                db.ref('money/history').push({
                    number: amount,
                    negative: pendingNegative,
                    info: info
                });
            }

            closeBalanceForm();
        }

        // --- VYKRESLENÍ LOMENÉHO GRAFU (POSLEDNÍCH 10 ZÁPISŮ) ---
        function renderTrendChart(history) {
            const svg = document.getElementById('trendSvg');
            svg.innerHTML = '';

            if (!history || history.length === 0) return;

            // Vezmeme maximálně posledních 10 záznamů a spočítáme průběžný zůstatek v čase
            const last10 = history.slice(-10);
            let runningSum = 0;
            const points = last10.map(item => {
                const amount = Number(item.number) || 0;
                runningSum += (item.negative ? -amount : amount);
                return runningSum;
            });

            if (points.length < 2) return; // Pro lomenou čáru potřebujeme alespoň 2 body

            const min = Math.min(...points);
            const max = Math.max(...points);
            const range = max - min === 0 ? 1 : max - min;

            const width = 180;
            const height = 35;
            const padding = 5;

            const coords = points.map((val, index) => {
                const x = (index / (points.length - 1)) * (width - padding * 2) + padding;
                // Osa Y je invertovaná (SVG má 0 nahoře)
                const y = height - padding - ((val - min) / range) * (height - padding * 2);
                return { x, y };
            });

            // Sestavení SVG polyline bodů
            const ptsString = coords.map(c => `${c.x},${c.y}`).join(' ');

            const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
            polyline.setAttribute('points', ptsString);
            polyline.setAttribute('fill', 'none');
            polyline.setAttribute('stroke', '#38bdf8');
            polyline.setAttribute('stroke-width', '2.5');
            polyline.setAttribute('stroke-linecap', 'round');
            polyline.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(polyline);

            // Vykreslení malých bodů na vrcholech
            coords.forEach(c => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', c.x);
                circle.setAttribute('cy', c.y);
                circle.setAttribute('r', '3');
                circle.setAttribute('fill', '#090d16');
                circle.setAttribute('stroke', '#38bdf8');
                circle.setAttribute('stroke-width', '2');
                svg.appendChild(circle);
            });
        }

        // --- AKTUALIZACE ZŮSTATKU A BAREV ---
        function updateBalanceDisplay(history) {
            const valueEl = document.getElementById('balanceValue');

            const sum = (history || []).reduce((acc, item) => {
                if (!item) return acc;
                const amount = Number(item.number) || 0;
                return acc + (item.negative ? -amount : amount);
            }, 0);

            valueEl.textContent = `${formatBalance(sum)} Kč`;

            // Změna barev podle nových limitů (<100 červená, 100-200 žlutá, >200 zelená)
            valueEl.className = 'balance-value';
            if (isPulsingActive) valueEl.classList.add('pulsing');

            if (sum > 200) {
                valueEl.classList.add('color-green');
            } else if (sum >= 100) {
                valueEl.classList.add('color-yellow');
            } else {
                valueEl.classList.add('color-red');
            }

            // Vykreslení lomeného grafu
            renderTrendChart(history);
        }

        // --- HISTORIE A EDITACE POLOŽEK ---
        let editingHistoryKey = null;
        let historyPressTimer = null;
        let historyPressTriggered = false;
        let activeHistoryItem = null;

        function startHistoryPress(key) {
            if (!document.getElementById('editPanel').classList.contains('visible')) return;
            historyPressTriggered = false;
            clearTimeout(historyPressTimer);
            historyPressTimer = setTimeout(() => {
                historyPressTriggered = true;
                openHistoryActionSheet(key);
                if (navigator.vibrate) navigator.vibrate(30);
            }, 500);
        }

        function cancelHistoryPress() {
            clearTimeout(historyPressTimer);
        }

        function openHistoryActionSheet(key) {
            activeHistoryItem = key;
            document.getElementById('historyActionOverlay').classList.add('active');
            document.getElementById('historyActionSheet').classList.add('active');
        }

        function closeHistoryActionSheet() {
            document.getElementById('historyActionOverlay').classList.remove('active');
            document.getElementById('historyActionSheet').classList.remove('active');
            activeHistoryItem = null;
        }

        function deleteHistoryEntryFromSheet() {
            if (!activeHistoryItem) return;
            db.ref('money/history/' + activeHistoryItem).remove();
            closeHistoryActionSheet();
        }

        function editHistoryEntryFromSheet() {
            if (!activeHistoryItem) return;
            db.ref('money/history/' + activeHistoryItem).once('value', (snapshot) => {
                const item = snapshot.val();
                if (!item) return;
                editingHistoryKey = activeHistoryItem;
                pendingNegative = !!item.negative;
                document.getElementById('balanceFormTitle').textContent = pendingNegative ? 'Upravit odebranou částku' : 'Upravit přidanou částku';
                document.getElementById('inpBalanceAmount').value = item.number;
                document.getElementById('inpBalanceInfo').value = item.info || '';
                closeHistoryActionSheet();
                document.getElementById('balanceFormOverlay').classList.add('active');
                document.getElementById('balanceForm').classList.add('active');
            });
        }

        function renderHistory(history) {
            const container = document.getElementById('historyList');
            container.innerHTML = '';

            updateBalanceDisplay(history);

            if (!history || history.length === 0) return;

            history.slice().reverse().forEach(item => {
                if (!item || !item.key) return;
                const el = document.createElement('div');
                el.className = 'history-item';
                const sign = item.negative ? '-' : '+';
                const cls = item.negative ? 'negative' : 'positive';
                el.innerHTML = `
                    <span class="history-info">${item.info || ''}</span>
                    <span class="history-amount ${cls}">${sign}${formatBalance(item.number)} Kč</span>
                `;

                el.addEventListener('mousedown', () => startHistoryPress(item.key));
                el.addEventListener('touchstart', () => startHistoryPress(item.key), { passive: true });
                el.addEventListener('mouseup', cancelHistoryPress);
                el.addEventListener('mouseleave', cancelHistoryPress);
                el.addEventListener('touchend', cancelHistoryPress);
                el.addEventListener('touchmove', cancelHistoryPress);
                el.addEventListener('click', (e) => {
                    if (historyPressTriggered) { e.preventDefault(); e.stopPropagation(); }
                });

                container.appendChild(el);
            });
        }

        function listenToHistory() {
            db.ref('money/history').on('value', (snapshot) => {
                const data = snapshot.val();
                let history = [];
                if (data) {
                    history = Object.entries(data).map(([key, value]) => ({ ...value, key }));
                }
                renderHistory(history);
            });
        }

        listenToHistory();
    </script>
</body>
</html>
